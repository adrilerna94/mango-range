name: CI

# Solo en PR: el ruleset de `main` exige PR, estos checks en verde y la rama
# al día, así que lo que entra en `main` ya se ha probado tal cual. Repetirlo
# en el push del merge solo duplicaría la ejecución.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # La app sirve su propio mock, así que los E2E prueban la API de este
      # mismo PR y no la de producción.
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Con CI=true, Playwright arranca `npm run start` (build de producción).
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
